# Dependabot (tinkerologie standard: see STANDARDS.md in tinkerologie/.github)
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-non-breaking:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  # uv: Dependabot updates pyproject.toml and uv.lock together, for version and security updates.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      python-non-breaking:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
