name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/translink/manifest.json
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read # jobs request only what they need

# One release run at a time, never cancelled: a run must not delete or publish
# a draft another run is still filling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the release commit
      id-token: write # mint the OIDC token that signs the attestation
      attestations: write # store the build provenance attestation
    outputs:
      version: ${{ steps.extract.outputs.version }}
      release_exists: ${{ steps.extract.outputs.release_exists }}
      prerelease: ${{ steps.extract.outputs.prerelease }}
      make_latest: ${{ steps.extract.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Validate version and extract release notes from CHANGELOG.md
        id: extract
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import re
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/translink/manifest.json").read_text(encoding="utf-8")
          )
          version = str(manifest.get("version", "")).strip()

          pyproject = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          pyproject_version = str(pyproject.get("project", {}).get("version", "")).strip()
          if version != pyproject_version:
              print(
                  f"::error::Version mismatch: manifest.json ({version}) != pyproject.toml ({pyproject_version}).",
                  file=sys.stderr,
              )
              sys.exit(1)

          # Validate Home Assistant CalVer format (e.g. 2026.10.0 or 2026.10.0b1)
          ha_version_re = re.compile(r"^[0-9]{4}\.(1[0-2]|[1-9])\.[0-9]+([a-z0-9.-]+)?$")
          if not ha_version_re.match(version):
              print(
                  f"::error::manifest.json version '{version}' does not match Home Assistant versioning (e.g. 2026.10.0).",
                  file=sys.stderr,
              )
              sys.exit(1)

          changelog_text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = re.compile(
              rf"^##\s+\[?{re.escape(version)}\]?(?:\s+-\s+[^\n]+)?\s*$",
              re.MULTILINE,
          )
          match = pattern.search(changelog_text)
          if not match:
              print(
                  f"::error::Version {version} from manifest.json was not found in CHANGELOG.md.",
                  file=sys.stderr,
              )
              sys.exit(1)

          start_idx = match.end()
          next_heading = re.search(r"^##\s+\[?", changelog_text[start_idx:], re.MULTILINE)
          if next_heading:
              notes = changelog_text[start_idx : start_idx + next_heading.start()].strip()
          else:
              notes = changelog_text[start_idx:].strip()

          if not notes:
              print(
                  f"::error::CHANGELOG.md section for {version} is empty.",
                  file=sys.stderr,
              )
              sys.exit(1)

          notes_path = Path("release_notes.md")
          notes_path.write_text(notes + "\n", encoding="utf-8")

          # Only a published release counts: a leftover draft for this tag is
          # deleted and rebuilt by the publish job.
          release_check = subprocess.run(
              ["gh", "release", "view", version, "--json", "isDraft", "--jq", ".isDraft"],
              capture_output=True,
              text=True,
              check=False,
          )
          if release_check.returncode != 0 and "release not found" not in release_check.stderr:
              print(f"::error::Could not look up release {version}: {release_check.stderr.strip()}", file=sys.stderr)
              sys.exit(1)
          release_exists = release_check.returncode == 0 and release_check.stdout.strip() == "false"

          is_prerelease = bool(re.search(r"[a-zA-Z]", version))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"release_exists={'true' if release_exists else 'false'}\n")
              fh.write(f"prerelease={'true' if is_prerelease else 'false'}\n")
              fh.write(f"make_latest={'false' if is_prerelease else 'true'}\n")

          print(f"Validated version {version} (release_exists={release_exists}, prerelease={is_prerelease})")
          EOF

      - name: Build release zip
        if: steps.extract.outputs.release_exists == 'false'
        env:
          VERSION: ${{ steps.extract.outputs.version }}
        run: |
          # Timestamps come from the release commit, so the tag rebuilds byte-identically.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          python3 script/build_release_zip.py --output-dir dist --version "$VERSION"
          cp CHANGELOG.md release_notes.md dist/

      - name: Attest build provenance
        if: steps.extract.outputs.release_exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/translink.zip

      - name: Upload release assets
        if: steps.extract.outputs.release_exists == 'false'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    if: needs.build.outputs.release_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft, upload assets, publish the release and tag
      attestations: read # verify the attestation before publishing
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Verify checksum and provenance
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          # The same command the README gives users, pinned to this workflow.
          gh attestation verify dist/translink.zip --repo "$GH_REPO" \
            --signer-workflow "$GH_REPO/.github/workflows/release.yml"

      - name: Create draft release with assets
        env:
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # A rerun after a failed publish finds the earlier run's draft for this
          # tag (the tag itself only exists once a release is published): delete
          # it so the rerun starts from one clean draft. Tags are never deleted.
          matches=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq '.[] | select(.tag_name == env.VERSION) | "\(.id) \(.draft)"')
          while read -r id draft; do
            [ -n "$id" ] || continue
            if [ "$draft" != "true" ]; then
              echo "::error::Release $VERSION is already published"
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/releases/$id"
          done <<< "$matches"
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # Immutable releases lock assets on publish, so upload to a draft first.
          gh release create "$VERSION" \
            --draft \
            "${flags[@]}" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file dist/release_notes.md \
            dist/translink.zip \
            dist/SHA256SUMS \
            dist/CHANGELOG.md

      - name: Publish release
        env:
          MAKE_LATEST: ${{ needs.build.outputs.make_latest }}
        run: gh release edit "$VERSION" --draft=false --latest="$MAKE_LATEST"

      - name: Verify the immutable release
        run: |
          # GitHub creates the release attestation shortly after publication, so
          # retry for about a minute. A release published without immutability
          # never gets one, so the step still fails and the setting can't lapse
          # unnoticed.
          for attempt in $(seq 1 12); do
            if gh release verify "$VERSION"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::No release attestation for $VERSION. Is release immutability enabled?"
              exit 1
            fi
            echo "Release attestation not available yet (attempt $attempt/12); retrying in 5 seconds."
            sleep 5
          done
          gh release verify-asset "$VERSION" dist/translink.zip
