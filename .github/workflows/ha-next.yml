name: HA Next

# Early warning for upcoming Home Assistant releases, on two channels:
# - release: the newest Home Assistant on PyPI, beta included;
# - dev: the head of Core's dev branch, weeks before the next beta.
# Removals and deprecations show up before the release ships. It never blocks a
# merge: the jobs continue on error, and scheduled or manual runs on main open
# (or close) one issue per channel, labelled ha-next and bug, instead.
on:
  schedule:
    - cron: 0 3 * * 1
      timezone: Australia/Brisbane
  workflow_dispatch:
    inputs:
      ha_version:
        description: Release channel version to test (blank for the newest, beta included)
        required: false
        default: ""
  pull_request:
    paths:
      - pyproject.toml
      - script/test
      - script/hassfest
      - custom_components/translink/manifest.json
      - script/import_smoke.py
      - tests/conftest.py
      - tests/deprecations.py
      - .github/workflows/ha-next.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ha-next:
    name: Next Home Assistant (${{ matrix.channel }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        channel: [release, dev]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          enable-cache: true

      - name: Set up Python
        run: |
          uv python install 3.14.2
          uv venv --python 3.14.2
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Resolve Home Assistant version
        id: resolve
        env:
          CHANNEL: ${{ matrix.channel }}
          REQUESTED_VERSION: ${{ inputs.ha_version }}
        run: |
          set -eo pipefail
          if [[ "$CHANNEL" == dev ]]; then
            # Pin one commit so the install and Hassfest test the same Core.
            revision=$(git ls-remote https://github.com/home-assistant/core.git refs/heads/dev | cut -f1)
            if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
              echo "::error::Could not resolve the head of Core's dev branch"
              exit 1
            fi
            echo "Home Assistant dev at $revision"
            {
              echo "ha_version=dev@${revision:0:12}"
              echo "revision=$revision"
              echo "requirement=homeassistant @ https://github.com/home-assistant/core/archive/$revision.tar.gz"
              echo "hassfest_ref=$revision"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "::error::Invalid Home Assistant version: $REQUESTED_VERSION"
              exit 1
            fi
            ha_version="$REQUESTED_VERSION"
          else
            # Select a release the runner can install, including pre-releases.
            ha_version=$(curl -fsSL --retry 3 https://pypi.org/pypi/homeassistant/json |
              uv run --no-project --python 3.14.2 --with packaging python -c '
          import json, platform, sys
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
          python = Version(platform.python_version())
          releases = json.load(sys.stdin)["releases"]
          print(max(
              (v for v, files in releases.items()
               if any(
                   not file.get("yanked") and file.get("requires_python")
                   and python in SpecifierSet(file["requires_python"])
                   for file in files
               )),
              key=Version,
          ))
          ')
          fi
          echo "Home Assistant $ha_version"
          {
            echo "ha_version=$ha_version"
            echo "requirement=homeassistant==$ha_version"
          } >> "$GITHUB_OUTPUT"

      - name: Check out the resolved Core development commit
        if: matrix.channel == 'dev'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: ${{ steps.resolve.outputs.revision }}
          path: .local/ha-next-core
          persist-credentials: false

      - name: Classify the official test plugin
        id: classify
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_VERSION: ${{ steps.resolve.outputs.ha_version }}
          CORE_REVISION: ${{ steps.resolve.outputs.revision }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == dev ]]; then
            [[ "$(git -C .local/ha-next-core rev-parse HEAD)" == "$CORE_REVISION" ]]
            echo "core_available=true" >> "$GITHUB_OUTPUT"
            if [[ -f .local/ha-next-core/packages/pytest-homeassistant/pyproject.toml ]]; then
              echo "harness=supported" >> "$GITHUB_OUTPUT"
              echo "reason=official plugin present at resolved Core commit" >> "$GITHUB_OUTPUT"
            else
              echo "harness=unsupported" >> "$GITHUB_OUTPUT"
              echo "reason=plugin package absent at resolved Core commit" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          uv run --no-project --python 3.14.2 --with packaging python - <<'PYTHON'
          import json
          import os
          import platform
          from urllib.error import HTTPError
          from urllib.request import urlopen

          from packaging.requirements import Requirement
          from packaging.specifiers import SpecifierSet
          from packaging.utils import canonicalize_name
          from packaging.version import Version

          version = Version(os.environ["HA_VERSION"])
          python = Version(platform.python_version())

          def release(package):
              try:
                  with urlopen(f"https://pypi.org/pypi/{package}/{version}/json", timeout=30) as response:
                      return json.load(response)
              except HTTPError as err:
                  if err.code == 404:
                      return None
                  raise

          def compatible(metadata):
              files = metadata["urls"]
              requirements = metadata["info"]["requires_dist"]
              if not isinstance(files, list) or not isinstance(requirements, list):
                  raise ValueError("Invalid PyPI release metadata")
              return any(
                  python in SpecifierSet(file["requires_python"]) and not file.get("yanked", False)
                  for file in files
              )

          core = release("homeassistant")
          state, core_available = "unsupported", "false"
          if core is None:
              reason = "Home Assistant release not published"
          elif not compatible(core):
              reason = "Home Assistant release is yanked or Python-incompatible"
          else:
              core_available = "true"
              plugin = release("pytest-homeassistant")
              if plugin is None:
                  reason = "no matching pytest-homeassistant release"
              elif not compatible(plugin):
                  reason = "matching release is yanked or Python-incompatible"
              else:
                  ha_requirements = [
                      req for value in plugin["info"]["requires_dist"]
                      if canonicalize_name((req := Requirement(value)).name) == "homeassistant"
                  ]
                  if not ha_requirements:
                      raise ValueError("Plugin metadata has no Home Assistant requirement")
                  if all(version in req.specifier for req in ha_requirements):
                      state, reason = "supported", "matching official plugin release"
                  else:
                      reason = "release does not pin the selected Home Assistant version"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"harness={state}\nreason={reason}\ncore_available={core_available}\n")
          PYTHON

      - name: Resolve the Core release tag
        id: release_revision
        if: matrix.channel == 'release' && steps.classify.outputs.core_available == 'true'
        env:
          HA_VERSION: ${{ steps.resolve.outputs.ha_version }}
        run: |
          set -eo pipefail
          revision=$(git ls-remote https://github.com/home-assistant/core.git \
            "refs/tags/$HA_VERSION" "refs/tags/$HA_VERSION^{}" | tail -n 1 | cut -f1)
          if [[ ! "$revision" =~ ^[a-f0-9]{40}$ ]]; then
            echo "::error::Could not resolve the Core tag for Home Assistant $HA_VERSION"
            exit 1
          fi
          echo "ref=$revision" >> "$GITHUB_OUTPUT"

      - name: Build the Core development test plugin
        if: matrix.channel == 'dev' && steps.classify.outputs.harness == 'supported'
        run: uv build .local/ha-next-core/packages/pytest-homeassistant --out-dir "$RUNNER_TEMP/ha-next-wheels"

      - name: Install Home Assistant and the test harness
        id: install
        if: steps.classify.outputs.core_available == 'true'
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_VERSION: ${{ steps.resolve.outputs.ha_version }}
          REQUIREMENT: ${{ steps.resolve.outputs.requirement }}
          HARNESS: ${{ steps.classify.outputs.harness }}
        run: |
          set -euo pipefail
          if [[ "$CHANNEL" == dev ]]; then
            REQUIREMENT="$PWD/.local/ha-next-core"
          fi
          if [[ "$HARNESS" == supported ]]; then
            if [[ "$CHANNEL" == dev ]]; then
              wheels=("$RUNNER_TEMP"/ha-next-wheels/*.whl)
              [[ ${#wheels[@]} == 1 && -f "${wheels[0]}" ]]
              plugin="${wheels[0]}"
            else
              plugin="pytest-homeassistant==$HA_VERSION"
            fi
            uv pip install . "$REQUIREMENT" "$plugin" \
              "PyTurboJPEG>=2.2.0" "av>=16.1.0" "ha-ffmpeg>=3.2.2" \
              "segno==1.6.6" "pytest-cov>=4.0.0" "pytest-timeout>=2.0.0"
            if uv pip show pytest-homeassistant-custom-component >/dev/null 2>&1; then
              echo "::error::Both Home Assistant test plugins are installed"
              exit 1
            fi
            if [[ "$CHANNEL" == dev ]]; then
              python - <<'PYTHON'
          import json
          import os
          from importlib.metadata import distribution
          from pathlib import Path

          core = Path(".local/ha-next-core").resolve().as_uri()
          wheel, = (Path(os.environ["RUNNER_TEMP"]) / "ha-next-wheels").glob("*.whl")
          for name, expected in (("homeassistant", core), ("pytest-homeassistant", wheel.resolve().as_uri())):
              origin = json.loads(distribution(name).read_text("direct_url.json"))
              if origin["url"] != expected:
                  raise SystemExit(f"{name} was installed from an unexpected origin")
          PYTHON
            fi
          else
            uv pip install . "$REQUIREMENT"
          fi
          python -c "from homeassistant.const import __version__; print('Installed Home Assistant', __version__)"

      - name: Import every module and check for deprecations
        id: smoke
        if: steps.classify.outputs.core_available == 'true'
        continue-on-error: true
        run: python script/import_smoke.py

      - name: Run tests with deprecation checks
        id: tests
        if: steps.classify.outputs.harness == 'supported'
        continue-on-error: true
        run: pytest --no-cov -q

      - name: Validate with Hassfest from the same release
        id: hassfest
        if: steps.classify.outputs.core_available == 'true'
        continue-on-error: true
        env:
          HA_VERSION: ${{ steps.resolve.outputs.hassfest_ref || steps.release_revision.outputs.ref }}
        run: ./script/hassfest --skip-plugins ""

      - name: Summarize
        id: summary
        if: always()
        env:
          CHANNEL: ${{ matrix.channel }}
          HA_VERSION: ${{ steps.resolve.outputs.ha_version }}
          INSTALL: ${{ steps.install.outcome }}
          CLASSIFY: ${{ steps.classify.outcome }}
          REASON: ${{ steps.classify.outputs.reason }}
          HARNESS: ${{ steps.classify.outputs.harness }}
          CORE_AVAILABLE: ${{ steps.classify.outputs.core_available }}
          SMOKE: ${{ steps.smoke.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          HASSFEST: ${{ steps.hassfest.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Require each check that the resolved release can run.
          status=success
          if [[ "$JOB_STATUS" != success || "$CLASSIFY" != success ]]; then
            status=failure
          fi
          if [[ "$CORE_AVAILABLE" == true ]]; then
            for outcome in "$INSTALL" "$SMOKE" "$HASSFEST"; do
              if [[ "$outcome" != success ]]; then
                status=failure
              fi
            done
          elif [[ "$CORE_AVAILABLE" != false ]]; then
            status=failure
          fi
          if [[ "$HARNESS" == supported && "$TESTS" != success ]]; then
            status=failure
          fi
          tests="$TESTS"
          if [[ "$HARNESS" == unsupported ]]; then
            tests="skipped: $REASON"
            if [[ "$status" == success ]]; then
              status=unsupported
              echo "::notice::Unsupported test harness for $HA_VERSION: $REASON"
            fi
          fi
          {
            echo "## Home Assistant ${HA_VERSION:-unresolved}"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Classify | ${CLASSIFY:-not run} (${REASON:-no result}) |"
            echo "| Install | ${INSTALL:-not run} |"
            echo "| Import smoke | ${SMOKE:-not run} |"
            echo "| Tests | ${tests:-not run} |"
            echo "| Hassfest | ${HASSFEST:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ha-next-result
          jq -n --arg channel "$CHANNEL" --arg version "${HA_VERSION:-unresolved}" \
            --arg status "$status" --arg install "${INSTALL:-not run}" \
            --arg harness "$HARNESS" --arg reason "$REASON" \
            '{channel: $channel, version: $version, status: $status, install: $install, harness: $harness, reason: $reason}' > "ha-next-result/$CHANNEL.json"
          if [[ "$status" == failure ]]; then
            echo "::error::HA Next checks failed for Home Assistant ${HA_VERSION:-unresolved}. See the run summary."
            exit 1
          fi

      # Matrix jobs cannot each set a job output, so the report reads these files.
      - name: Upload the channel result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-next-${{ matrix.channel }}
          path: ha-next-result/
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: ha-next
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # download the channel results
      issues: write # open, update and close the ha-next issues
    steps:
      - name: Download the channel results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a channel that stopped early uploaded nothing
        with:
          pattern: ha-next-*
          path: ha-next-result
          merge-multiple: true

      - name: Open, update or close the ha-next issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            // bug lets CodeRabbit plan the fix as soon as the issue opens.
            const labels = [
              { name: "ha-next", color: "fbca04", description: "Breakage or deprecation in the next Home Assistant release" },
              { name: "bug", color: "d73a4a", description: "Something isn't working" },
            ];
            const channels = {
              release: "HA Next checks failed for the upcoming Home Assistant release",
              dev: "HA Next checks failed for Home Assistant Core dev",
            };

            const { data: open } = await github.rest.issues.listForRepo({
              owner,
              repo,
              labels: "ha-next",
              state: "open",
              per_page: 50,
            });

            for (const [channel, title] of Object.entries(channels)) {
              let result = { version: "unresolved", status: "failure" };
              try {
                result = JSON.parse(fs.readFileSync(`ha-next-result/${channel}.json`, "utf8"));
              } catch {
                // No result means the job stopped before its summary step.
              }
              const marker = `<!-- ha-next:${channel} -->`;
              const issue = open.find((item) => !item.pull_request && item.body?.includes(marker));

              if (result.status === "unsupported") {
                continue;
              }

              if (result.status === "success") {
                if (issue) {
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: issue.number,
                    body: `Home Assistant ${result.version} passes again: ${runUrl}`,
                  });
                  await github.rest.issues.update({
                    owner,
                    repo,
                    issue_number: issue.number,
                    state: "closed",
                    state_reason: "completed",
                  });
                }
                continue;
              }

              const failure = result.install === "success"
                ? "Inspect the import smoke, pytest and Hassfest results in the run summary."
                : "Check version resolution, the plugin probe and dependency installation in the run log.";
              const body = [
                marker,
                `The HA Next workflow failed on the ${channel} channel against Home Assistant ${result.version}.`,
                "",
                `Run log: ${runUrl}`,
                "",
                failure,
              ].join("\n");

              if (issue) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issue.number,
                  body,
                });
                continue;
              }

              for (const label of labels) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: label.name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({ owner, repo, ...label });
                }
              }
              await github.rest.issues.create({
                owner,
                repo,
                title,
                labels: labels.map((label) => label.name),
                body,
              });
            }
